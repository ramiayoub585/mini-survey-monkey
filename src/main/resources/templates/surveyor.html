<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <title>Manage surveys</title>
</head>
<body>
<header th:replace="~{fragments/header :: header('surveyor')}"></header>
<h1>Manage surveys</h1>

<table>
  <thead><tr><th>ID</th><th>Title</th><th>Status</th></tr></thead>
  <tbody>
  <tr th:each="survey : ${surveys}">
    <td th:text="${survey.id}">1</td>
    <td><a th:href="@{/surveys/{id}(id=${survey.id})}" th:text="${survey.title}">Title</a></td>
    <td><span class="badge" th:classappend="${survey.active} ? 'open' : 'closed'" th:text="${survey.active} ? 'Open' : 'Closed'">Open</span></td>
  </tr>
  </tbody>
</table>

<h2>Create a survey</h2>
<p class="error" role="alert" th:if="${error}" th:text="${error}">Error message</p>
<form th:action="@{/surveys}" method="post">
  <label>Title: <input type="text" name="title" th:value="${title}" required></label>
  <button type="submit">Create survey</button>
</form>
</body>
</html>
